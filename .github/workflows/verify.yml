name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  end-to-end:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install .
      - name: Syntax check
        run: python -m compileall -q src
      - name: Built-in fixture migration (expects validation issues)
        run: |
          set +e
          python main.py --input examples/messy_transactions.json --constraints examples/constraints.json --anonymize --output-dir ci-builtin
          code=$?
          set -e
          test "$code" -eq 1
      - name: Verify built-in outputs
        run: |
          python .cursor/skills/verify-airlock-db/scripts/verify_migration_output.py ci-builtin \
            --expected-checked 32 --expected-valid 8 --expected-invalid 24 --expected-rows 8 \
            --anonymized-field account_id --expect-type-mismatch-note
      - name: Dynamic real-data sample migration
        run: |
          python main.py --input examples/real_data/online_retail_sample.jsonl \
            --config examples/real_data/online_retail_schema.json --anonymize --output-dir ci-real
      - name: Verify dynamic outputs
        run: |
          python .cursor/skills/verify-airlock-db/scripts/verify_migration_output.py ci-real \
            --expected-checked 10 --expected-valid 10 --expected-invalid 0 --expected-rows 10 \
            --anonymized-field customer_id
      - name: JSONL-only target
        run: |
          python main.py --input examples/real_data/online_retail_sample.jsonl \
            --config examples/real_data/online_retail_schema.json --anonymize \
            --output-format jsonl --output-dir ci-jsonl
          test ! -f ci-jsonl/target_migration.db
          python .cursor/skills/verify-airlock-db/scripts/verify_migration_output.py ci-jsonl \
            --skip-sqlite --expected-checked 10 --expected-valid 10 --expected-invalid 0 \
            --expected-jsonl-rows 10
      - name: CSV and TSV ingestion
        run: |
          python - <<'PY'
          import csv

          header = ["transaction_id", "account_id", "posted_at", "amount", "currency",
                    "transaction_type", "status", "counterparty", "description"]
          rows = [
              ["3f8a1c2e-4b6d-4e9a-8f1c-2d5e7a9b0c11", "ACC-1001", "2026-01-15T09:30:00Z",
               "125.50", "USD", "DEBIT", "POSTED", "Northwind, Ltd", "Monthly supplies"],
              ["8b2d4f6a-1c3e-4a5b-9d7e-0f1a2b3c4d5e", "ACC_2200", "2026-02-03T16:45:00+02:00",
               "89.99", "EUR", "CREDIT", "POSTED", "Blue Yonder Airlines", ""],
              ["not-a-uuid", "ACC-1001", "2026-03-01T10:00:00Z", "10.00", "USD", "DEBIT",
               "POSTED", "Example Co", ""],
          ]
          with open("ci-basic.csv", "w", encoding="utf-8-sig", newline="") as stream:
              writer = csv.writer(stream)
              writer.writerow(header)
              writer.writerows(rows)
          PY
          python main.py --input ci-basic.csv --output-dir ci-csv || test $? -eq 1
          python .cursor/skills/verify-airlock-db/scripts/verify_migration_output.py ci-csv \
            --expected-checked 3 --expected-valid 2 --expected-invalid 1 --expected-rows 2
      - name: Archive input
        run: |
          python .cursor/skills/verify-airlock-db/scripts/verify_archive_input.py ci-archives
      - name: Schema inference
        run: |
          python .cursor/skills/verify-airlock-db/scripts/verify_schema_infer.py ci-infer
      - name: Target verification
        run: |
          python .cursor/skills/verify-airlock-db/scripts/verify_handoff.py ci-handoff
      - name: Multi-table source database
        run: |
          python - <<'PY'
          import sqlite3

          columns = ("transaction_id TEXT, account_id TEXT, posted_at TEXT, amount TEXT, "
                     "currency TEXT, transaction_type TEXT, status TEXT, counterparty TEXT, "
                     "description TEXT")
          connection = sqlite3.connect("ci-multi.db")
          connection.execute(f"CREATE TABLE a ({columns})")
          connection.execute(f"CREATE TABLE b ({columns})")
          connection.execute(
              "INSERT INTO a VALUES ('3f8a1c2e-4b6d-4e9a-8f1c-2d5e7a9b0c11', 'ACC-1001', "
              "'2026-01-15T09:30:00Z', '125.50', 'USD', 'DEBIT', 'POSTED', 'Northwind', NULL)")
          connection.execute(
              "INSERT INTO b VALUES ('8b2d4f6a-1c3e-4a5b-9d7e-0f1a2b3c4d5e', 'ACC_2200', "
              "'2026-02-03T16:45:00+02:00', '89.99', 'EUR', 'CREDIT', 'POSTED', 'Blue Yonder', NULL)")
          connection.execute(
              "INSERT INTO b VALUES ('not-a-uuid', 'ACC-1001', '2026-03-01T10:00:00Z', "
              "'10.00', 'USD', 'DEBIT', 'POSTED', 'Example', NULL)")
          connection.commit()
          connection.close()
          PY
          python main.py --source-db ci-multi.db --source-table a --source-table b --output-dir ci-multi || test $? -eq 1
          python .cursor/skills/verify-airlock-db/scripts/verify_migration_output.py ci-multi \
            --expected-checked 3 --expected-valid 2 --expected-invalid 1 --expected-rows 2
      - name: Repair workflow with resume
        run: |
          python main.py --input examples/messy_transactions.json --constraints examples/constraints.json --error-log --output-dir ci-repair || test $? -eq 1
          printf 'd\nd\nq\n' | python main.py repair --error-log ci-repair/airlock_errors.jsonl --constraints examples/constraints.json | grep -q '0 corrected, 2 dropped'
          printf 'q\n' | python main.py repair --error-log ci-repair/airlock_errors.jsonl --constraints examples/constraints.json | grep -q 'Resumed: 2'
      - name: Scripted repair decisions and report refresh
        run: |
          python main.py --input examples/messy_transactions.json --constraints examples/constraints.json --error-log --output-dir ci-decisions || test $? -eq 1
          printf '{"entry": 1, "action": "drop"}\n{"entry": 2, "action": "set", "field": "amount", "value": "5.00"}\n{"entry": 3, "action": "set", "field": "status", "value": "POSTED"}\n' > ci-decisions.jsonl
          python main.py repair --error-log ci-decisions/airlock_errors.jsonl --constraints examples/constraints.json --decisions ci-decisions.jsonl
          python main.py report --output-dir ci-decisions | grep -q 'Repair outcomes: 2 corrected, 1 dropped'
      - name: XML equivalence
        run: |
          python .cursor/skills/verify-airlock-db/scripts/verify_xml_equivalence.py \
            examples/messy_transactions.json --constraints examples/constraints.json
      - name: Source database ingestion
        run: |
          python - <<'PY'
          import json
          import sqlite3

          rows = json.load(open("examples/messy_transactions.json", encoding="utf-8"))
          chosen = [rows[0], rows[3], rows[4], rows[8]]
          connection = sqlite3.connect("legacy-source.db")
          connection.execute(
              "CREATE TABLE transactions (transaction_id TEXT, account_id TEXT, "
              "posted_at TEXT, amount TEXT, currency TEXT, transaction_type TEXT, "
              "status TEXT, counterparty TEXT, description TEXT)"
          )
          for row in chosen:
              amount = row.get("amount")
              if isinstance(amount, float):
                  amount = repr(amount)
              connection.execute(
                  "INSERT INTO transactions VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)",
                  (
                      row.get("transaction_id"),
                      row.get("account_id"),
                      row.get("posted_at"),
                      amount,
                      row.get("currency"),
                      row.get("transaction_type"),
                      row.get("status"),
                      row.get("counterparty"),
                      row.get("description"),
                  ),
              )
          connection.commit()
          connection.close()
          PY
          python main.py --source-db legacy-source.db --output-dir ci-source-db || test $? -eq 1
          python .cursor/skills/verify-airlock-db/scripts/verify_migration_output.py ci-source-db \
            --expected-checked 4 --expected-valid 2 --expected-invalid 2 --expected-rows 2
      - if: matrix.os == 'ubuntu-latest'
        name: Migration soak (reduced)
        run: |
          python scripts/soak_migration.py --rows 100000 --max-peak-rss-mib 300 ci-soak
      - name: CLI previews, queries, and decisions template
        run: |
          python .cursor/skills/verify-airlock-db/scripts/verify_cli_wins.py ci-cli-wins
      - name: YAML schema config
        run: |
          printf '{"ticket_id": "TKT-000001", "customer_name": "Alice", "priority": "HIGH", "opened_at": "2026-01-05T08:00:00Z"}\n' > ci-ticket.jsonl
          python main.py --input ci-ticket.jsonl --config examples/schema_config.yaml --output-dir ci-yaml
      - name: Schema transforms
        run: |
          python .cursor/skills/verify-airlock-db/scripts/verify_transforms.py ci-transforms
      - name: Fixed-width input
        run: |
          python .cursor/skills/verify-airlock-db/scripts/verify_fixed_width.py ci-fixed-width
      - name: JSONL and CSV reader edges
        run: |
          python .cursor/skills/verify-airlock-db/scripts/verify_jsonl_reader.py ci-reader-edges
      - name: Checkpoint and resume
        run: |
          python main.py --input examples/messy_transactions.json --constraints examples/constraints.json --commit-every 4 --output-dir ci-checkpoint || test $? -eq 1
          python main.py --input examples/messy_transactions.json --constraints examples/constraints.json --commit-every 4 --resume --output-dir ci-checkpoint > ci-resume.log || test $? -eq 1
          grep -q 'Resumed: 32' ci-resume.log
          python .cursor/skills/verify-airlock-db/scripts/verify_migration_output.py ci-checkpoint \
            --expected-checked 32 --expected-valid 8 --expected-invalid 24 --expected-rows 8
