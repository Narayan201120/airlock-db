[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock-db"
version = "0.1.0"
description = "Local-first database migration and schema validation tool"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6,<3", "PyYAML>=6,<7"]

[project.scripts]
airlock-db = "airlock_db.cli:main"
schema-sentry = "airlock_db.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
