version: 1
model_name: SupportTicket
id_field: ticket_id
strict: false
strip_whitespace: true
fields:
  ticket_id:
    type: string
    required: true
    pattern: '^TKT-[0-9]{6}$'
    max_length: 10
  customer_name:
    type: string
    required: true
    min_length: 1
    max_length: 120
    anonymize: true
  priority:
    type: enum
    values: [LOW, NORMAL, HIGH]
    required: true
  estimated_cost:
    type: decimal
    required: false
    gt: '0'
    max_digits: 12
    decimal_places: 2
  opened_at:
    type: datetime
    required: true
  notes:
    type: string
    required: false
    max_length: 500
